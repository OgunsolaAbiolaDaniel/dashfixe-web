# The one rule that prevents another broken main: no red merges.
# `check` runs the full gate (types + lint + unit/UI tests) and the production
# build; `smoke` then drives the BUILT app in a real browser (Playwright) —
# chunks, pre-rendered heads, the pilot API and the session cookie.
# docs/ARCHITECTURE.md §8.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx vite build

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
